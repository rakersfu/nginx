name: nginx_arm_docker_build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Enable QEMU for Docker
      run: |
        docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

    - name: Setup Docker buildx
      run: |
        docker buildx create --use
        docker buildx inspect --bootstrap

    - name: Build inside ARM container
      run: |
        cat << 'EOF' > build.sh
        apk add build-base wget tar zlib-dev

        # OpenSSL
        wget https://www.openssl.org/source/openssl-3.0.12.tar.gz
        tar -xzf openssl-3.0.12.tar.gz
        cd openssl-3.0.12
        ./Configure linux-aarch64 no-shared
        make -j$(nproc)
        cd ..

        # PCRE2
        wget https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.42/pcre2-10.42.tar.gz
        tar -xzf pcre2-10.42.tar.gz
        cd pcre2-10.42
        ./configure --disable-shared --enable-static
        make -j$(nproc)
        cd ..

        # Nginx
        wget http://nginx.org/download/nginx-1.25.3.tar.gz
        tar -xzf nginx-1.25.3.tar.gz
        cd nginx-1.25.3

        ./configure \
          --prefix=/opt/nginx \
          --with-http_ssl_module \
          --with-http_v2_module \
          --with-http_gzip_static_module \
          --with-pcre=../pcre2-10.42 \
          --with-openssl=../openssl-3.0.12 \
          --with-openssl-opt=no-shared \
          --with-ld-opt="-static" \
          --with-cc-opt="-static -static-libgcc"

        make -j$(nproc)
        cp objs/nginx /src/nginx
        EOF

        docker run --rm -v $PWD:/src -w /src --platform=linux/arm64 arm64v8/alpine:3.19 sh build.sh

    - name: Upload nginx binary
      uses: softprops/action-gh-release@v1
      with:
        tag_name: nginx-arm-docker
        name: "nginx ARM Docker Build"
        files: nginx
      env:
        GITHUB_TOKEN: ${{ secrets.GH_PAT }}

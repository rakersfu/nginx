name: nginx_arm_static_build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Enable QEMU for Docker (ARM emulation)
      run: |
        docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

    - name: Setup Docker buildx (ARM image support)
      run: |
        docker buildx create --use
        docker buildx inspect --bootstrap

    - name: Build inside ARM container
      run: |
        cat << 'EOF' > build.sh
        set -e
        apk add build-base wget tar perl

        echo "=== Build zlib (static) ==="
        wget https://zlib.net/current/zlib.tar.gz
        tar -xzf zlib.tar.gz
        mv zlib-* zlib-src

        echo "=== Build OpenSSL (static, no apps) ==="
        wget https://www.openssl.org/source/openssl-3.0.12.tar.gz
        tar -xzf openssl-3.0.12.tar.gz
        mv openssl-3.0.12 openssl-src
        cd openssl-src
        ./Configure linux-aarch64 no-shared no-apps
        make -j1
        cd ..

        echo "=== Build PCRE2 (static) ==="
        wget https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.42/pcre2-10.42.tar.gz
        tar -xzf pcre2-10.42.tar.gz
        mv pcre2-10.42 pcre2-src
        cd pcre2-src
        ./configure --disable-shared --enable-static
        make -j$(nproc)
        cd ..

        echo "=== Build Nginx (static ARM) ==="
        wget http://nginx.org/download/nginx-1.25.3.tar.gz
        tar -xzf nginx-1.25.3.tar.gz
        cd nginx-1.25.3

        ./configure \
          --prefix=/opt/nginx \
          --with-http_ssl_module \
          --with-http_v2_module \
          --with-http_gzip_static_module \
          --with-pcre=../pcre2-src \
          --with-openssl=../openssl-src \
          --with-zlib=../zlib-src \
          --with-openssl-opt=no-shared \
          --with-ld-opt="-static" \
          --with-cc-opt="-static -static-libgcc"

        make -j$(nproc)
        cp objs/nginx /src/nginx
        EOF

        docker run --rm -v $PWD:/src -w /src --platform=linux/arm64 arm64v8/alpine:3.19 sh build.sh

    - name: Upload nginx binary
      uses: softprops/action-gh-release@v1
      with:
        tag_name: nginx-arm-static
        name: "nginx ARM Static Build"
        body: "ARM static Nginx with OpenSSL 3.0.12 (no-apps) + PCRE2 10.42 + zlib"
        files: nginx
      env:
        GITHUB_TOKEN: ${{ secrets.GH_PAT }}

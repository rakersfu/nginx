name: build-nginx-static-openssl

on:
  workflow_dispatch:
  # push:
  #   branches: [ main ]

env:
  NGINX_VERSION: "1.30.7"
  OPENSSL_VERSION: "3.0.12"

jobs:
  build-nginx:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential wget tar make gcc g++ \
          zlib1g-dev \
          libpcre3-dev

    # 1. 编译 OpenSSL 静态库
    - name: Build OpenSSL static
      run: |
        wget https://www.openssl.org/source/openssl-${{ env.OPENSSL_VERSION }}.tar.gz -O openssl.tar.gz
        tar -zxvf openssl.tar.gz
        mv openssl-${{ env.OPENSSL_VERSION }} openssl-src
        cd openssl-src
        ./config no-shared
        make -j$(nproc)
        # 注意：这里不执行 make install，Nginx 直接从源码目录链接

    # 2. 下载 Nginx 源码
    - name: Download Nginx source
      run: |
        wget https://nginx.org/download/nginx-${{ env.NGINX_VERSION }}.tar.gz -O nginx.tar.gz
        tar -zxvf nginx.tar.gz

    # 3. 编译 Nginx
    # 策略：
    # - 静态链接 OpenSSL (no-shared)
    # - 使用系统 PCRE (--with-pcre)
    # - Nginx 主体动态链接 glibc (确保 Ubuntu 兼容性，避免 Signal 11)
    - name: Configure and build Nginx
      working-directory: ./nginx-${{ env.NGINX_VERSION }}
      run: |
        ./configure --prefix=/opt/nginx \
          --with-http_ssl_module \
          --with-http_v2_module \
          --with-http_gzip_static_module \
          --with-pcre \
          --with-openssl=../openssl-src \
          --with-openssl-opt=no-shared
        make -j$(nproc)

    # 4. 验证二进制文件
    - name: Verify binary
      working-directory: ./nginx-${{ env.NGINX_VERSION }}
      run: |
        # 检查是否静态链接了 OpenSSL
        ldd objs/nginx | grep -i ssl || echo "OpenSSL statically linked (as expected)"
        # 检查是否动态链接了系统 PCRE
        ldd objs/nginx | grep pcre
        # 确保可执行
        chmod +x objs/nginx

    # 5. 发布单个二进制文件
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: nginx-ubuntu-${{ env.NGINX_VERSION }}
        name: "nginx-ubuntu-${{ env.NGINX_VERSION }}"
        body: |
          Nginx ${{ env.NGINX_VERSION }} with statically linked OpenSSL 3.0.12.
          Built on Ubuntu 22.04. Uses system PCRE and glibc.
          
          **Deployment:**
          1. `curl -L -o /usr/local/bin/nginx <download_url>`
          2. `chmod +x /usr/local/bin/nginx`
          3. Ensure config at `/opt/nginx/conf/nginx.conf`
          4. `systemctl start nginx`
        files: ./nginx-${{ env.NGINX_VERSION }}/objs/nginx
        token: ${{ secrets.GH_TOKEN }}

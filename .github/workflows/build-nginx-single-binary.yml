name: build-nginx-single-binary

on:
  workflow_dispatch:
  # push:
  #   branches: [ main ]

env:
  NGINX_VERSION: "1.25.4" # 建议使用官方稳定版
  OPENSSL_VERSION: "3.0.12"
  PCRE2_VERSION: "10.42"

jobs:
  build-nginx:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential wget tar make gcc g++ \
          zlib1g zlib1g-dev

    # 1. 编译 OpenSSL 静态库并安装到统一目录
    - name: Build OpenSSL static
      run: |
        wget https://www.openssl.org/source/openssl-${{ env.OPENSSL_VERSION }}.tar.gz
        tar -zxvf openssl-${{ env.OPENSSL_VERSION }}.tar.gz
        mv openssl-${{ env.OPENSSL_VERSION }} openssl-src
        cd openssl-src
        # 使用 no-shared 生成静态库
        ./config no-shared linux-x86_64
        make -j$(nproc)
        # 关键修改：安装静态库到统一目录，避免查找路径问题
        make install --prefix=/tmp/static-deps --openssldir=/tmp/static-deps/ssl
        cd ..

    # 2. 编译 PCRE2 静态库并安装到统一目录
    - name: Build PCRE2 static
      run: |
        wget https://github.com/PCRE2Project/pcre2/releases/download/pcre2-${{ env.PCRE2_VERSION }}/pcre2-${{ env.PCRE2_VERSION }}.tar.gz
        tar -zxvf pcre2-${{ env.PCRE2_VERSION }}.tar.gz
        mv pcre2-${{ env.PCRE2_VERSION }} pcre2-src
        cd pcre2-src
        # 静态编译，安装到统一目录
        ./configure --disable-shared --enable-static --prefix=/tmp/static-deps
        make -j$(nproc)
        make install
        cd ..

    # 3. 下载 Nginx 源码
    - name: Download Nginx source
      run: |
        wget "https://nginx.org/download/nginx-${{ env.NGINX_VERSION }}.tar.gz"
        tar -zxvf nginx-${{ env.NGINX_VERSION }}.tar.gz

    # 4. 编译 Nginx
    # 策略：静态链接 OpenSSL 和 PCRE2（来自 /tmp/static-deps），Nginx 主体动态链接 glibc
    - name: Configure and build Nginx
      working-directory: ./nginx-${{ env.NGINX_VERSION }}
      run: |
        # 验证静态库存在
        ls -l /tmp/static-deps/lib/libssl.a
        ls -l /tmp/static-deps/lib/libpcre2-8.a
        
        ./configure --prefix=/opt/nginx \
          --with-http_ssl_module \
          --with-http_v2_module \
          --with-http_gzip_static_module \
          --with-pcre=/tmp/static-deps \
          --with-openssl=/tmp/static-deps \
          --with-cc-opt="-I/tmp/static-deps/include -L/tmp/static-deps/lib -Wl,-rpath,/opt/nginx/lib -static-libgcc" \
          --with-ld-opt="-L/tmp/static-deps/lib -Wl,-rpath,/opt/nginx/lib -static-libgcc -static-libstdc++"
        make -j$(nproc)
        
        # 检查二进制依赖，确保没有缺失的第三方库
        ldd objs/nginx | grep -v "linux-vdso\|ld-linux\|libgcc\|libc.so\|libpthread\|libdl\|libm" || echo "Only system glibc deps found"

    # 5. 准备发布目录
    - name: Prepare release
      run: |
        mkdir -p release
        cp objs/nginx release/nginx
        chmod +x release/nginx

    # 6. 创建 GitHub Release（单个二进制文件）
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: nginx-ubuntu-glibc-${{ env.NGINX_VERSION }}
        name: "nginx-ubuntu-glibc-${{ env.NGINX_VERSION }}"
        body: |
          Nginx ${{ env.NGINX_VERSION }} with statically linked OpenSSL and PCRE2.
          Designed for Ubuntu 22.04 glibc environment.
          
          **Deployment:**
          1. Download binary: `curl -L -o /usr/local/bin/nginx <download_url>`
          2. Ensure config at `/opt/nginx/conf/nginx.conf`
          3. `systemctl start nginx`
        files: release/nginx
        token: ${{ secrets.GH_TOKEN }}
